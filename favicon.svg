<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Icono XV elegante">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#fce7ef"/>
      <stop offset="60%" stop-color="#e8b7c8"/>
      <stop offset="100%" stop-color="#c57f99"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="100%" stop-color="#e4c56e"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="12" fill="none" stroke="url(#ring)" stroke-width="2"/>

  <text x="50%" y="57%" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="28" font-weight="700" letter-spacing="1" fill="#fffdf7">XV</text>
